name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

  build-windows:
    name: Build Windows Sender (.NET 8)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore WindowsSender/WindowsSender.csproj
          dotnet restore WindowsSenderGui/WindowsSenderGui.csproj

      - name: Build WindowsSender (CLI)
        run: dotnet build WindowsSender/WindowsSender.csproj --configuration Release --no-restore

      - name: Build WindowsSenderGui (WPF)
        run: dotnet build WindowsSenderGui/WindowsSenderGui.csproj --configuration Release --no-restore
